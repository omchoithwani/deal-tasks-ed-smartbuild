name: Weekly Task Digest Email

on:
  schedule:
    - cron: '30 21 * * 5'  # Every Friday at 4:30pm EST (UTC-5)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check secrets are set
        run: |
          [ -n "$RESEND_API_KEY" ] && echo "RESEND_API_KEY: set" || echo "RESEND_API_KEY: MISSING"
          [ -n "$FROM_EMAIL" ] && echo "FROM_EMAIL: set" || echo "FROM_EMAIL: MISSING"
          [ -n "$RECIPIENT_EMAILS" ] && echo "RECIPIENT_EMAILS: set" || echo "RECIPIENT_EMAILS: MISSING"
          [ -n "$HUBSPOT_ACCESS_TOKEN" ] && echo "HUBSPOT_ACCESS_TOKEN: set" || echo "HUBSPOT_ACCESS_TOKEN: MISSING"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}

      - name: Send weekly task digest
        run: node src/index.js
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          HUBSPOT_PROPOSAL_PROPERTY: proposal_submission_date
          HUBSPOT_OWNER_ID: ${{ secrets.HUBSPOT_OWNER_ID }}
